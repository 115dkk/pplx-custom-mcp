  <p>서울교통공사가 다음 달 1일부터 1호선과 2호선의 심야 연장운행을 다시 시작한다고 29일 밝혔다.</p>
  <p>연장운행은 평일 기준 자정에서 새벽 1시까지 30분 간격으로 운행되며, 주말에는 적용되지 않는다.</p>
  <p>공사 관계자는 심야 시간대 이동 수요가 코로나 이전 수준을 회복했다는 점을 재개 이유로 들었다.</p>
